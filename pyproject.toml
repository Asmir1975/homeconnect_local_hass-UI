[project]
version = "1.11.3"
name = "homeconnect_ws"
authors = [{ name = "chris-mc1" }]
description = "Home Connect Local for Homeassistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeconnect-websocket@git+https://github.com/Asmir1975/homeconnect_websocket.git@f59c2937005034a3243045c10bdd086c10e18b88",
]

[project.urls]
Homepage = "https://github.com/Asmir1975/homeconnect_local_hass-UI"
Issues = "https://github.com/Asmir1975/homeconnect_local_hass-UI/issues"

[dependency-groups]
dev = [
    "colorlog==6.10.1",
    "homeassistant==2026.5.3",
    "pytest-homeassistant-custom-component==0.13.332",
    "voluptuous-stubs==0.1.1",
    "ruff==0.15.17",
    "pre-commit==4.6.0",
]

test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "coverage>=7.10.6",
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
