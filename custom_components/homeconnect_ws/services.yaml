start_program:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: homeconnect_ws
    start_in:
      required: false
      selector:
        duration:
    finish_in:
      required: false
      selector:
        duration:

start_program_with_options:
  name: Start program with explicit options
  description: >-
    Start with one local request, without selecting first or adding cached options.
    All option values are explicit. Do not automatically retry after a timeout.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: homeconnect_ws
    program:
      name: Program key
      description: Full program key from the appliance description.
      required: true
      selector:
        text:
    options:
      name: Explicit program options
      description: Mapping of full option keys to values; durations are in seconds.
      required: true
      selector:
        object:

set_start_in:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: homeconnect_ws
    start_in:
      required: true
      selector:
        duration:

set_finish_in:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: homeconnect_ws
    finish_in:
      required: true
      selector:
        duration:
