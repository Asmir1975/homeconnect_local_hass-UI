# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"
line-length = 100

[lint]
select = ["ALL"]

ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D102",    # undocumented-public-method
    "D105",    # undocumented-magic-method
    "D107",    # Missing docstring in __init__
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "COM812",  # incompatible with formatter
    "ISC001",  # incompatible with formatter
    "ARG002",  # unused-method-argument
    "PLR2004", # magic-value-comparison
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"custom_components/homeconnect_ws/hc_auth.py" = [
    "EM101",   # Authentication errors need concise user-facing messages.
    "EM102",   # Dynamic HTTP status details are useful to the user.
    "PLR0912", # The downloader mirrors one linear multi-endpoint API flow.
    "PLR0915", # Splitting the flow would obscure how one appliance is assembled.
    "TRY003",  # HCAuthError intentionally carries user-facing failure context.
    "TRY301",  # Inline validation keeps parsing and its error adjacent.
]
